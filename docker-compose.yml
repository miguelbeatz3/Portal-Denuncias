services:
  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./backend
    expose:
      - "80"
    environment:
      APP_NAME: "Portal de Denúncias"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?}
      APP_URL: https://api.denuncias.it.ao
      APP_LOCALE: pt
      PORTAL_ADMIN_DOMAIN: admin.denuncias.it.ao
      PORTAL_ENTITY_DOMAIN: entidade.denuncias.it.ao
      PORTAL_TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: portal_denuncias_bd
      DB_USERNAME: portal
      DB_PASSWORD: ${DB_PASSWORD:?}
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - evidence:/var/www/html/storage/app/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: portal_denuncias_bd
      MYSQL_USER: portal
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  evidence:
  mysql:
