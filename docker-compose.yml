services:
  frontend:
    build:
      context: ./frontend
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./backend
    expose:
      - "80"
    environment:
      APP_NAME: "Portal de Denúncias"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?}
      APP_URL: https://api.denuncias.it.ao
      APP_LOCALE: pt
      PORTAL_ADMIN_DOMAIN: admin.denuncias.it.ao
      PORTAL_ENTITY_DOMAIN: entidade.denuncias.it.ao
      PORTAL_TRUSTED_PROXIES: "*"
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-portal_denuncias_bd}
      DB_USERNAME: ${DB_USERNAME:-portal}
      DB_PASSWORD: ${DB_PASSWORD:?}
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "true"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - evidence:/var/www/html/storage/app/private
    networks:
      - default
      - mysql_destination
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  evidence:

networks:
  mysql_destination:
    external: true
    name: ${DB_NETWORK:-coolify}
